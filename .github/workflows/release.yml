name: Release

# Push a tag like v1.0.0: builds the single-file installer and attaches it to a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build installer
        shell: pwsh
        run: ./tools/build-release.ps1 -Version ("${{ github.ref_name }}".TrimStart('v'))
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Radii-Setup-*.exe
            dist/SHA256SUMS.txt
