name: Idea / feature request
description: Suggest something new
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it is useful
      description: Your use case, or how you do it today.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Ring / menu, Extensions flyout, Converter, Installer, Settings, Other]
